name: Update ZYFXS Mirror

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "12 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest ZYFXS files
        run: python3 zy/update_zy.py
      - name: Push to secret gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MIRROR_GIST_ID: "1b96b5c80faebc6bac9429fbf5e86305"
        run: python3 gist/push_gist.py zy-clash.yaml zy-v2ray.txt
