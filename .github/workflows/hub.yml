name: Update Hub Clash

on:
  push:
    paths:
      - hub/token.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hub and build clash yaml
        run: python3 hub/update_hub.py
      - name: Push to secret gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MIRROR_GIST_ID: "1b96b5c80faebc6bac9429fbf5e86305"
        run: python3 gist/push_gist.py hub-clash.yaml
